<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chop Fix Admin</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700;800&family=Barlow+Condensed:wght@700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="/admin/admin.css"></head><body>
<header><img src="/assets/logo.png"><div><h1>CHOP FIX ADMIN</h1><p>Products, orders and fulfilment.</p></div><button id="logout" hidden>Log out</button></header>
<main>
<section id="login" class="panel login"><h2>ADMIN LOGIN</h2><form id="loginForm"><label>Password<input name="password" type="password" required></label><button>ENTER DASHBOARD</button><p id="loginMsg"></p></form></section>
<section id="app" hidden>
<div class="stats" id="stats"></div>
<div class="tabs"><button data-tab="orders" class="active">Orders</button><button data-tab="products">Products</button></div>
<div id="ordersTab"><div class="panel"><div class="panel-head"><h2>ORDERS</h2><button id="refresh">Refresh</button></div><div class="table-wrap"><table><thead><tr><th>Reference</th><th>Customer</th><th>Total</th><th>Payment</th><th>Status</th><th>Created</th></tr></thead><tbody id="orders"></tbody></table></div></div></div>
<div id="productsTab" hidden><div class="grid"><section class="panel"><h2>MENU ITEMS</h2><div id="products"></div></section><section class="panel"><h2>ADD / EDIT ITEM</h2><form id="productForm"><input name="id" type="hidden"><label>Name<input name="name" required></label><label>Category<input name="category" required></label><label>Price (₦)<input name="price" type="number" min="0" required></label><label>Image path<input name="image" value="/assets/jollof.png"></label><label>Description<textarea name="description"></textarea></label><label>Sort order<input name="sort_order" type="number" value="0"></label><label class="check"><input name="available" type="checkbox" checked> Available</label><button>SAVE ITEM</button><button type="button" id="clearForm" class="ghost">Clear</button></form></section></div></div>
</section></main><script src="/admin/admin.js"></script></body></html>
